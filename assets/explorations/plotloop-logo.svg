<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 716 240" width="100%" height="100%">
  <defs>
    <!-- 遮罩：用于在第二个 o 上切出一个完美的水平缺口 -->
    <mask id="gap-mask">
      <rect x="0" y="0" width="100%" height="100%" fill="white" />
      <rect x="480" y="102" width="40" height="16" fill="black" />
    </mask>
  </defs>

  <g fill="#000000">
    <!-- p -->
    <rect x="20" y="64" width="16" height="156" />
    <circle cx="66" cy="110" r="38" stroke="#000000" stroke-width="16" fill="none" />

    <!-- l -->
    <rect x="136" y="0" width="16" height="156" />

    <!-- o -->
    <circle cx="222" cy="110" r="38" stroke="#000000" stroke-width="16" fill="none" />

    <!-- t -->
    <rect x="292" y="36" width="16" height="120" />
    <rect x="284" y="64" width="40" height="16" />

    <!-- l -->
    <rect x="332" y="0" width="16" height="156" />

    <!-- o -->
    <circle cx="418" cy="110" r="38" stroke="#000000" stroke-width="16" fill="none" />

    <!-- o (左侧带有断口的特殊设计) -->
    <circle cx="534" cy="110" r="38" stroke="#000000" stroke-width="16" fill="none" mask="url(#gap-mask)" />

    <!-- p -->
    <rect x="604" y="64" width="16" height="156" />
    <circle cx="650" cy="110" r="38" stroke="#000000" stroke-width="16" fill="none" />
  </g>
</svg>
