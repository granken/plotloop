<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 360" role="img" aria-labelledby="title desc">
  <title id="title">plotloop mark preview</title>
  <desc id="desc">Preview sheet for four plotloop logo mark variants.</desc>
  <rect width="1160" height="360" fill="#F6F1E7"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#080A0F">
    <text x="40" y="54" font-size="26" font-weight="750">plotloop mark explorations</text>
    <text x="40" y="82" font-size="15" opacity="0.66">Loop cartography first. Spinning-top energy only as pivot / reality-check accent.</text>
  </g>

  <g transform="translate(40 116)">
    <rect width="244" height="204" rx="16" fill="#FFFFFF" stroke="#E1D9CA"/>
    <image href="logo-mark-01-loop-tiles.svg" x="46" y="20" width="152" height="152"/>
    <text x="122" y="184" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#080A0F">01 Loop Tiles</text>
  </g>

  <g transform="translate(320 116)">
    <rect width="244" height="204" rx="16" fill="#FFFFFF" stroke="#E1D9CA"/>
    <image href="logo-mark-02-pivot-gap.svg" x="46" y="20" width="152" height="152"/>
    <text x="122" y="184" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#080A0F">02 Pivot Gap</text>
  </g>

  <g transform="translate(600 116)">
    <rect width="244" height="204" rx="16" fill="#FFFFFF" stroke="#E1D9CA"/>
    <image href="logo-mark-03-spin-axis.svg" x="46" y="20" width="152" height="152"/>
    <text x="122" y="184" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#080A0F">03 Spin Axis</text>
  </g>

  <g transform="translate(880 116)">
    <rect width="244" height="204" rx="16" fill="#FFFFFF" stroke="#E1D9CA"/>
    <image href="logo-mark-04-mono-stamp.svg" x="46" y="20" width="152" height="152"/>
    <text x="122" y="184" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#080A0F">04 Mono Stamp</text>
  </g>
</svg>
